name: ZYROCRAFT APK

on:
  push:
    branches:
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Get LTW
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/LTW
          workflow: android.yml
          workflow_conclusion: success
          name: output-aar
          path: app_pojavlauncher/libs

      - name: Get Mesa
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          repo: MojoLauncher/mesa-unified2
          workflow: android.yml
          workflow_conclusion: success
          branch: mojo/26.2
          name: mesa-aar
          path: app_pojavlauncher/libs

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.5"

      - name: Build debug APK
        id: build
        continue-on-error: true
        run: |
          gradle :app_pojavlauncher:assembleFullDebug --console=plain --no-daemon 2>&1 | tee gradle-build.log

      - name: Report build errors
        if: steps.build.outcome == 'failure'
        run: |
          echo "### Build errors"
          grep -nE "error:|e: |FAILURE:|What went wrong|Caused by:|AAPT" gradle-build.log | head -30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          tail -n 40 gradle-build.log
          exit 1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: zyrocraft-apk
          path: app_pojavlauncher/build/outputs/apk/full/debug/*.apk

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: zyro-apk-${{ github.run_number }}
          name: ZYROCRAFT APK build ${{ github.run_number }}
          prerelease: true
          fail_on_unmatched_files: true
          files: app_pojavlauncher/build/outputs/apk/full/debug/*.apk
